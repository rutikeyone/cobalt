include: analysis_options.yaml

# Turns on the cobalt_lint plugin, which is off by default.
#
# Copy this over `analysis_options.yaml` when you want the rules in your
# editor, and do not commit the result. It stays off by default for a reason
# publication does not remove: the analysis server builds a synthetic
# `plugin_entrypoint` package and resolves it **against pub.dev**, using an
# `analysis_server_plugin` version the *SDK* chooses — not one this repository
# writes.
#
# `analysis_server_plugin` pins the analyzer it depends on exactly, and
# `cobalt_lint` declares `analyzer: ">=10.0.1 <15.0.0"` (see RELEASING.md).
# An SDK whose bundled `analysis_server_plugin` asks for an analyzer outside
# that range, or for a version pub.dev does not have yet, makes the synthetic
# package fail to resolve, and analysis crashes before a single file is read,
# on every file in the repository, not only ones this plugin would flag. That
# is not a failure of the code being analysed, so it must not gate a build,
# and it is why `analysis_options.yaml` does not enable the plugin itself.
#
# The next analyzer major is admitted by a `cobalt_lint` release, so each SDK
# that brings one is a window in which the plugin cannot load until that
# release is out.
#
# The rules themselves do not depend on any of this: they are covered by
# tests that go through `analyzer_testing` and never start a server.
plugins:
  cobalt_lint: ^0.2.0
