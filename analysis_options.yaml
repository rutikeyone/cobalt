include: package:lints/recommended.yaml

# The cobalt_lint plugin is enabled from `analysis_options.plugin.yaml`, not
# from here — permanently, not only until publication. Naming it in this file
# makes every `dart analyze` in the repository resolve a synthetic plugin
# package against pub.dev using an `analysis_server_plugin` version the SDK
# chooses; once that version needs an analyzer newer than what `cobalt_lint`
# supports — which the beta channel already does — analysis crashes before a
# single file is read. See that file for the full explanation and for how to
# turn the plugin on locally.

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    todo: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - unawaited_futures
