name: cobalt_go_router
description: go_router bindings for Cobalt — dependency scopes whose lifetime is a navigation flow, created on entry and disposed on exit.
version: 0.1.1
repository: https://github.com/rutikeyone/cobalt
issue_tracker: https://github.com/rutikeyone/cobalt/issues
topics:
  - dependency-injection
  - di
  - go-router
  - navigation

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

resolution: workspace

dependencies:
  cobalt_flutter: ^0.1.0
  flutter:
    sdk: flutter
  go_router: ^17.0.0

dev_dependencies:
  cobalt_test_flutter: ^0.1.0
  cobalt_test: ^0.1.0
  flutter_test:
    sdk: flutter
