name: cobalt
description: Dependency injection for Dart and Flutter. Scopes close everything they built when they end, async services start in dependency order, and tests can override any dependency.
version: 1.3.0
repository: https://github.com/rutikeyone/cobalt
issue_tracker: https://github.com/rutikeyone/cobalt/issues
topics:
  - dependency-injection
  - di
  - service-locator
  - scopes

environment:
  sdk: ^3.10.0


dependencies:
  cobalt_annotations: ^1.2.0
  collection: ^1.19.0
  meta: ^1.16.0

dev_dependencies:
  lints: ^6.0.0
  cobalt_test: ^1.0.0
  leak_tracker: ^11.0.0
  test: ^1.25.0
