name: cobalt
description: Dependency injection for Dart and Flutter. Scopes close everything they built when they end, async services start in dependency order, and tests can override any dependency.
version: 1.8.0
repository: https://github.com/rutikeyone/cobalt
issue_tracker: https://github.com/rutikeyone/cobalt/issues
topics:
  - dependency-injection
  - di
  - service-locator
  - scopes
screenshots:
  - description: "The live scope tree in cobalt_inspector: each scope, what it registers, and how long each registration lives."
    path: screenshots/tree.png
  - description: "The examples gallery: one runnable example per capability, in four languages."
    path: screenshots/hub.png

environment:
  sdk: ^3.10.0


dependencies:
  cobalt_annotations: ^1.5.0
  collection: ^1.19.0
  meta: ^1.16.0

dev_dependencies:
  lints: ^6.0.0
  cobalt_test: ^1.0.0
  leak_tracker: ^11.0.0
  test: ^1.25.0
