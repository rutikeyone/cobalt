name: cobalt_flutter
description: Dependency injection for Flutter apps. Widgets own scopes, startup shows loading and error screens, and context.cobalt<T>() reads a dependency in any widget.
version: 1.8.0
repository: https://github.com/rutikeyone/cobalt
issue_tracker: https://github.com/rutikeyone/cobalt/issues
topics:
  - dependency-injection
  - di
  - flutter
  - scopes
screenshots:
  - description: "A tour of the gallery: a session scope opened, then the live scope tree."
    path: screenshots/quick-tour.gif
  - description: "The live scope tree in cobalt_inspector: each scope, what it registers, and how long each registration lives."
    path: screenshots/tree.png
  - description: "A scope owned by a navigation flow: the order draft lives while the user stays inside the checkout."
    path: screenshots/flow.png

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"


dependencies:
  cobalt: ^1.8.0
  flutter:
    sdk: flutter

dev_dependencies:
  lints: ^6.0.0
  cobalt_test: ^1.0.0
  flutter_test:
    sdk: flutter
