name: cobalt_flutter
description: Dependency injection for Flutter apps. Widgets own scopes, startup shows loading and error screens, and context.cobalt<T>() reads a dependency in any widget.
version: 1.3.0
repository: https://github.com/rutikeyone/cobalt
issue_tracker: https://github.com/rutikeyone/cobalt/issues
topics:
  - dependency-injection
  - di
  - flutter
  - scopes

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"


dependencies:
  cobalt: ^1.2.0
  flutter:
    sdk: flutter

dev_dependencies:
  lints: ^6.0.0
  cobalt_test: ^1.0.0
  flutter_test:
    sdk: flutter
