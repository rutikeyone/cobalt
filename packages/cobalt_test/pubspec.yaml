name: cobalt_test
description: Test helpers for Cobalt — build and tear down graphs, override dependencies, and check that a hand-written graph resolves.
version: 1.8.0
repository: https://github.com/rutikeyone/cobalt
issue_tracker: https://github.com/rutikeyone/cobalt/issues
topics:
  - dependency-injection
  - di
  - testing
  - test

screenshots:
  - description: "The Cobalt icon: scopes inside scopes, each closing what it built."
    path: screenshots/icon.png

environment:
  sdk: ^3.10.0


dependencies:
  cobalt: ^1.5.0
  matcher: ^0.12.16
  test_api: ^0.7.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
