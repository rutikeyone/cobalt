name: cobalt_talker_flutter
description: Dresses talker's log screen in the same palette as the Cobalt inspector, so the graph's events and its log read as one tool inside your app.
version: 1.1.0
repository: https://github.com/rutikeyone/cobalt
issue_tracker: https://github.com/rutikeyone/cobalt/issues
topics:
  - dependency-injection
  - logging
  - devtools
  - debugging

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"


dependencies:
  cobalt_inspector: ^1.0.0
  cobalt_talker: ^1.0.0
  flutter:
    sdk: flutter
  talker_flutter: ^5.1.0

dev_dependencies:
  lints: ^6.0.0
  cobalt: ^1.0.0
  cobalt_test: ^1.0.0
  talker: ^5.1.0
  flutter_test:
    sdk: flutter
