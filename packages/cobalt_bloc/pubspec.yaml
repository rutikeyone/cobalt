name: cobalt_bloc
description: Lets a Cobalt scope close the blocs it built — a mixin that bridges bloc's close() to Cobalt's AsyncDisposable, and the function to name where a mixin will not reach.
version: 1.8.0
repository: https://github.com/rutikeyone/cobalt
issue_tracker: https://github.com/rutikeyone/cobalt/issues
topics:
  - dependency-injection
  - di
  - bloc
  - state-management

screenshots:
  - description: "The Cobalt icon: scopes inside scopes, each closing what it built."
    path: screenshots/icon.png

environment:
  sdk: ^3.10.0


dependencies:
  cobalt: ^1.0.0
  bloc: ^9.0.0

dev_dependencies:
  lints: ^6.0.0
  cobalt_test: ^1.0.0
  test: ^1.25.0
