name: cobalt_bloc
description: Lets an Cobalt scope close the blocs it built — a mixin that bridges bloc's close() to Cobalt's AsyncDisposable, and the function to name where a mixin will not reach.
version: 0.1.1
repository: https://github.com/rutikeyone/cobalt
issue_tracker: https://github.com/rutikeyone/cobalt/issues
topics:
  - dependency-injection
  - di
  - bloc
  - state-management

environment:
  sdk: ^3.10.0

resolution: workspace

dependencies:
  cobalt: ^0.1.0
  bloc: ^9.0.0

dev_dependencies:
  cobalt_test: ^0.1.0
  test: ^1.25.0
