name: cobalt_analyzer
description: Internal analysis layer of cobalt_generator and cobalt_lint — parses Cobalt annotations once for both. Not covered by semver; depend on those packages instead.
version: 1.3.0
repository: https://github.com/rutikeyone/cobalt
issue_tracker: https://github.com/rutikeyone/cobalt/issues
topics:
  - dependency-injection
  - analyzer
  - codegen
  - static-analysis

environment:
  sdk: ^3.10.0


dependencies:
  cobalt: ^1.0.0
  cobalt_annotations: ^1.2.0
  analyzer: ">=10.0.1 <15.0.0"
  collection: ^1.19.0
  meta: ^1.16.0
  path: ^1.9.0

dev_dependencies:
  lints: ^6.0.0
  build: ^4.0.4
  build_test: ^3.5.4
  test: ^1.25.0
