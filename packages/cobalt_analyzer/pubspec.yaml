name: cobalt_analyzer
description: Shared static analysis layer for Cobalt. Parses Cobalt annotations once for both the generator and the lint plugin.
version: 0.1.2
repository: https://github.com/rutikeyone/cobalt
issue_tracker: https://github.com/rutikeyone/cobalt/issues
topics:
  - dependency-injection
  - analyzer
  - codegen
  - static-analysis

environment:
  sdk: ^3.10.0

resolution: workspace

dependencies:
  cobalt: ^0.1.0
  cobalt_annotations: ^0.1.0
  analyzer: ">=10.0.1 <13.0.0"
  collection: ^1.19.0
  meta: ^1.16.0
  path: ^1.9.0

dev_dependencies:
  build: ^4.0.4
  build_test: ^3.5.4
  test: ^1.25.0
