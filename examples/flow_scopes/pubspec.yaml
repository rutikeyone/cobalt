name: flow_scopes
description: Cobalt example — a navigation flow that owns its dependencies, wired with go_router.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"


dependencies:
  cobalt_go_router: ^0.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  go_router: ^17.0.0

dev_dependencies:
  lints: ^6.0.0
  cobalt_test_flutter: ^0.3.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
