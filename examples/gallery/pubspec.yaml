name: gallery
description: >-
  One app that hosts every Cobalt example — each opens with its own graph, built
  on entry and disposed on exit.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"


dependencies:
  cobalt: ^0.3.0
  cobalt_flutter: ^0.3.0
  cobalt_go_router: ^0.3.0
  cobalt_inspector: ^0.3.0
  cobalt_talker: ^0.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ">=17.0.0 <19.0.0"
  intl: ^0.20.2
  google_fonts: ^6.2.1

  # The examples themselves. Each stays an ordinary package in this repository,
  # so the gallery mounts their screens instead of copying them — and each
  # keeps its own generated container, which two of them could not share.
  codegen_basics: ^0.1.0
  flow_scopes: ^0.1.0
  graph_events: ^0.1.0
  notes_app: ^0.1.0
  talker: ^5.1.0

dev_dependencies:
  lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
