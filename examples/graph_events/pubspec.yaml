name: graph_events
description: Cobalt example — the DI graph's own events, streamed into talker.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"


dependencies:
  cobalt_flutter: ^0.2.0
  cobalt_talker: ^0.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  talker: ^5.1.0
  cobalt_talker_flutter: ^0.2.0
  talker_flutter: ^5.1.0

dev_dependencies:
  lints: ^6.0.0
  cobalt_test_flutter: ^0.2.0
  cobalt_test: ^0.2.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
