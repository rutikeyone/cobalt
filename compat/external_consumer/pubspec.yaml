name: cobalt_external_consumer
description: >-
  Compatibility stand: consumes Cobalt from outside its packages, the way a
  third-party project does.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  cobalt: ^0.3.0

dev_dependencies:
  cobalt_generator: ^0.3.0
  cobalt_lint: ^0.3.0
  cobalt_test: ^0.3.0
  build_runner: ^2.15.0
  lints: ^6.0.0
  test: ^1.28.0

dependency_overrides:
  cobalt:
    path: ../../packages/cobalt
  cobalt_annotations:
    path: ../../packages/cobalt_annotations
  cobalt_analyzer:
    path: ../../packages/cobalt_analyzer
  cobalt_generator:
    path: ../../packages/cobalt_generator
  cobalt_lint:
    path: ../../packages/cobalt_lint
  cobalt_test:
    path: ../../packages/cobalt_test
