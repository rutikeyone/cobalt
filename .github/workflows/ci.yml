name: ci

on:
  push:
    branches: [main]
  pull_request:
  # A dependency can break the build with no commit here: a new analyzer or
  # go_router lands on pub.dev and only `forward` resolves it. Weekly, so that
  # is found within days rather than on the next push.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9

      - name: Resolve every member
        run: ./tool/get.sh

      - name: Overrides are current
        run: python3 tool/overrides.py --check

      # Existence only. Whether a translation still says what the English says
      # is not checkable by machine — that is a line in the RELEASING checklist.
      - name: Translations are present
        run: |
          for f in README.ru.md README.zh-CN.md \
                   GUIDE_MANUAL.md GUIDE_MANUAL.ru.md GUIDE_MANUAL.zh-CN.md \
                   GUIDE_CODEGEN.md GUIDE_CODEGEN.ru.md GUIDE_CODEGEN.zh-CN.md \
                   MIGRATION.md MIGRATION.ru.md MIGRATION.zh-CN.md; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done

      - name: Analyze
        run: dart analyze --fatal-infos .

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Verify generated code is current
        run: |
          for package in examples/codegen_basics examples/notes_app \
                         compat/external_consumer; do
            (cd "$package" && dart run build_runner build)
          done
          for package in packages/cobalt_inspector examples/gallery \
                         examples/notes_app examples/flow_scopes \
                         examples/graph_events examples/codegen_basics; do
            (cd "$package" && flutter gen-l10n)
          done
          git diff --exit-code

      - name: Test every member
        run: ./tool/test.sh

      - name: Coverage
        run: |
          dart pub global activate coverage
          ./tool/coverage.sh

      - name: Publish dry run
        run: |
          for package in packages/cobalt_annotations packages/cobalt \
                         packages/cobalt_analyzer packages/cobalt_generator \
                         packages/cobalt_test packages/cobalt_talker \
                         packages/cobalt_bloc \
                         packages/cobalt_logging packages/cobalt_logger \
                         packages/cobalt_flutter packages/cobalt_go_router \
                         packages/cobalt_inspector \
                         packages/cobalt_talker_flutter \
                         packages/cobalt_test_flutter; do
            (cd "$package" && dart pub publish --dry-run)
          done

      # cobalt_lint cannot go in the loop above: pub exits non-zero because of
      # the lib/main.dart warning the analysis-server plugin API requires, and
      # which riverpod_lint carries too. Asserting the count instead still
      # fails the build if a second warning ever appears.
      - name: Publish dry run for cobalt_lint
        run: |
          cd packages/cobalt_lint
          dart pub publish --dry-run 2>&1 | tee /tmp/lint-dry-run.txt || true
          grep -q 'Package has 1 warning' /tmp/lint-dry-run.txt

  forward:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]
    continue-on-error: ${{ matrix.channel == 'beta' }}
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}

      - name: Resolve every member
        run: ./tool/get.sh

      - name: Analyze
        run: dart analyze --fatal-infos .

      - name: Generated code does not depend on the SDK
        run: |
          for package in examples/codegen_basics examples/notes_app \
                         compat/external_consumer; do
            (cd "$package" && dart run build_runner build)
          done
          git diff --exit-code -- '*.g.dart'

      - name: Test every member
        run: ./tool/test.sh
