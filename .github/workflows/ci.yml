name: ci

on:
  push:
    branches: [main]
  pull_request:
  # A dependency can break the build with no commit here: a new analyzer or
  # go_router lands on pub.dev and only `forward` resolves it. Weekly, so that
  # is found within days rather than on the next push.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9

      - name: Resolve every member
        run: ./tool/get.sh

      - name: Overrides are current
        run: python3 tool/overrides.py --check

      # A class modifier is API that dart_apitool does not see; the file makes
      # a change to one a reviewed line. See RELEASING, "What breaks".
      - name: Class modifiers are recorded
        run: python3 tool/modifiers.py --check

      - name: Every CHANGELOG has an entry for the current version
        run: |
          python3 tool/release_notes.py "$(sed -n 's/^version: *//p' packages/cobalt/pubspec.yaml)" > /dev/null

      # Existence only. Whether a translation still says what the English says
      # is not checkable by machine — that is a line in the RELEASING checklist.
      - name: Translations are present
        run: |
          for f in README.ru.md README.zh-CN.md README.ko.md \
                   GUIDE_MANUAL.md GUIDE_MANUAL.ru.md GUIDE_MANUAL.zh-CN.md GUIDE_MANUAL.ko.md \
                   GUIDE_CODEGEN.md GUIDE_CODEGEN.ru.md GUIDE_CODEGEN.zh-CN.md GUIDE_CODEGEN.ko.md \
                   MIGRATION.md MIGRATION.ru.md MIGRATION.zh-CN.md MIGRATION.ko.md; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done

      - name: Analyze
        run: dart analyze --fatal-infos .

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Verify generated code is current
        run: |
          for package in examples/hello examples/codegen_basics \
                         examples/notes_app compat/external_consumer; do
            (cd "$package" && dart run build_runner build)
          done
          for package in packages/cobalt_inspector examples/gallery \
                         examples/notes_app examples/flow_scopes \
                         examples/graph_events examples/codegen_basics; do
            (cd "$package" && flutter gen-l10n)
          done
          git diff --exit-code

      - name: Test every member
        run: ./tool/test.sh

      - name: Coverage
        run: |
          dart pub global activate coverage
          ./tool/coverage.sh

      - name: Publish dry run
        run: |
          for package in packages/cobalt_annotations packages/cobalt \
                         packages/cobalt_analyzer packages/cobalt_generator \
                         packages/cobalt_test packages/cobalt_talker \
                         packages/cobalt_bloc \
                         packages/cobalt_logging packages/cobalt_logger \
                         packages/cobalt_flutter packages/cobalt_go_router \
                         packages/cobalt_inspector \
                         packages/cobalt_talker_flutter \
                         packages/cobalt_test_flutter; do
            (cd "$package" && dart pub publish --dry-run)
          done

      # cobalt_lint cannot go in the loop above: pub exits non-zero because of
      # the lib/main.dart warning the analysis-server plugin API requires, and
      # which riverpod_lint carries too. Asserting the count instead still
      # fails the build if a second warning ever appears.
      - name: Publish dry run for cobalt_lint
        run: |
          cd packages/cobalt_lint
          dart pub publish --dry-run 2>&1 | tee /tmp/lint-dry-run.txt || true
          grep -q 'Package has 1 warning' /tmp/lint-dry-run.txt

  forward:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]
    continue-on-error: ${{ matrix.channel == 'beta' }}
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}

      - name: Resolve every member
        run: ./tool/get.sh

      - name: Analyze
        run: dart analyze --fatal-infos .

      - name: Generated code does not depend on the SDK
        run: |
          for package in examples/hello examples/codegen_basics \
                         examples/notes_app compat/external_consumer; do
            (cd "$package" && dart run build_runner build)
          done
          git diff --exit-code -- '*.g.dart'

      - name: Test every member
        run: ./tool/test.sh

  # cobalt_analyzer, cobalt_generator and cobalt_lint accept analyzer 10 to 14,
  # and its API breaks between 12 and 13. `verify` only ever resolves the
  # floor's 12.1.0 and `forward` the newest, so each row is tested here, with
  # the companions tool/matrix.sh pins for it. 13 and 14 need Dart 3.11, so
  # those rows run on a pinned newer Flutter rather than on moving `stable`.
  analyzer:
    name: analyzer ${{ matrix.analyzer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - analyzer: 10.0.1
            flutter: 3.38.9
          - analyzer: 12.1.0
            flutter: 3.38.9
          - analyzer: 13.3.0
            flutter: 3.47.1
          - analyzer: 14.4.0
            flutter: 3.47.1
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}

      - name: Test the analyzer-facing packages
        run: ./tool/matrix.sh ${{ matrix.analyzer }}

  # What changed in each package's public API since the release on pub.dev.
  # A gate: a breaking change fails unless the version is a major step past
  # the published one. @experimental members and cobalt_analyzer are reported,
  # not gated; class modifiers are the verify job's (tool/modifiers.py).
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9

      - name: Resolve every member
        run: ./tool/get.sh

      - name: No breaking change without a major version
        run: ./tool/api.sh

